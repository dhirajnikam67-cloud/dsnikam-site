<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power projects in India · DSN Assure</title>
<meta name="description" content="Search any grid-connected power project in India: capacity, connection point, status and what needs attention, from public records.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--navy-3:#1b3760;--gold:#e2ad48;--gold-2:#f3c86a;--gold-soft:#fbf1dc;--ink:#13213a;--muted:#5d677a;--line:#e4e2dc;--paper:#f6f5f1;
--act:#a3372a;--act-bg:#f8e6e2;--watch:#8a5b00;--watch-bg:#fbf0d6;--clear:#2a7346;--clear-bg:#e3f2e7;
--serif:"Source Serif 4",Georgia,serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper)}
a{color:inherit}
.top{background:var(--navy);color:#fff}
.top .in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px var(--serif)}
.brand i{display:inline-block;width:26px;height:26px;border-radius:6px;background:var(--gold);color:var(--navy);font:700 15px/26px var(--serif);text-align:center;font-style:normal}
.top nav{margin-left:auto;display:flex;gap:18px;font-size:14px}
.top nav a{text-decoration:none;opacity:.9}.top nav a.on{border-bottom:2px solid var(--gold);padding-bottom:3px}
.hero{background:var(--navy);color:#fff;padding:34px 24px 54px}
.hero .in{max-width:1180px;margin:0 auto}
.hero h1{font:700 38px/1.15 var(--serif);margin:0 0 8px;max-width:760px}
.hero p{margin:0 0 22px;color:#c9d3e3;max-width:680px}
.search{display:flex;gap:10px;max-width:760px}
.search input{flex:1;font:16px var(--sans);padding:14px 16px;border-radius:10px;border:0;outline:2px solid transparent}
.search input:focus{outline-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer}
.chip:hover{border-color:var(--gold)}
.stats{display:flex;gap:28px;margin-top:22px;color:#c9d3e3;font-size:13px}
.stats b{display:block;color:#fff;font:600 22px var(--serif)}
main{max-width:1180px;margin:-30px auto 40px;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px}
.list{max-height:78vh;overflow:auto}
.list h2,.detail h2{font:600 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 18px;cursor:pointer;font:inherit;color:inherit}
.row:hover,.row.on{background:var(--gold-soft)}
.row .n{font-weight:600}
.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.row .f{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font:500 12px var(--sans);padding:2px 8px;border-radius:999px;background:#eef1f6;color:var(--navy-3)}
.tag.act{background:var(--act-bg);color:var(--act)}.tag.watch{background:var(--watch-bg);color:var(--watch)}.tag.clear{background:var(--clear-bg);color:var(--clear)}
.detail{position:sticky;top:16px}
.dbody{padding:20px 22px}
.dbody h3{font:700 24px/1.2 var(--serif);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font:600 16px var(--sans)}
.sect{margin-top:18px}
.sect h4{font:600 14px var(--sans);margin:0 0 10px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.cat b{font:600 22px var(--serif)}
.lock{position:relative;margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lock .blur{filter:blur(5px);padding:14px 16px;user-select:none;pointer-events:none}
.lock .blur p{margin:0 0 10px}
.lock .cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.92));text-align:center;padding:16px}
.btn{font:600 14px var(--sans);padding:11px 18px;border-radius:9px;border:0;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.gold{background:var(--gold);color:var(--navy)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.src{margin-top:18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.src a{color:var(--navy-3)}
.claim{background:none;border:0;color:var(--navy-3);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.empty{padding:40px 22px;color:var(--muted);text-align:center}
.mono{font-family:var(--mono)}
@media (max-width:900px){main{grid-template-columns:1fr}.detail{position:static}.facts{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.list{max-height:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i>D</i>DSN Assure</a>
  <nav><a class="on" href="/projects/">Projects</a><a href="/tracker/">Tracker</a><a href="/app/">Sign in</a></nav>
</div></header>

<section class="hero"><div class="in">
  <h1>Every grid-connected power project in India, in one search.</h1>
  <p>Type a company, project, substation or state. See capacity, connection point, status and what needs attention, from public records.</p>
  <div class="search"><input id="q" type="search" placeholder="e.g. Adani Khavda, ReNew Jalore, Solapur PS, Rajasthan" autocomplete="off" aria-label="Search projects"></div>
  <div class="chips" id="chips"></div>
  <div class="stats" id="stats"></div>
</div></section>

<main>
  <section class="panel list" aria-label="Results"><h2 id="count">Projects</h2><div id="rows"></div></section>
  <section class="panel detail" aria-live="polite"><h2>Project</h2><div id="detail"><div class="empty">Pick a project to see its record.</div></div></section>
</main>

<script>
const fmt = (s) => { if (!s) return "—"; const [y, m, d] = s.split("-"); return `${d}.${m}.${y}`; };
const mw = (v) => v == null ? "—" : `${Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 })} MW`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sev = (fl) => fl.some((f) => f.s === "act") ? "act" : fl.length ? "watch" : "clear";
let DATA = [], META = {}, cur = null;

function render(list) {
  const rows = document.getElementById("rows");
  document.getElementById("count").textContent = `${list.length.toLocaleString("en-IN")} project${list.length === 1 ? "" : "s"}`;
  if (!list.length) { rows.innerHTML = '<div class="empty">No project matches yet.</div>'; return; }
  rows.innerHTML = list.slice(0, 200).map((p) => {
    const n = p.flags.length, s = sev(p.flags);
    return `<button class="row${cur === p.id ? " on" : ""}" data-id="${p.id}">
      <div class="n">${esc(p.applicant)}</div>
      <div class="m">${esc([p.substation, p.state, p.region].filter(Boolean).join(" · "))}</div>
      <div class="f"><span class="tag">${esc(p.type || "—")}</span><span class="tag">${mw(p.installed ?? p.conn)}</span>${p.group ? `<span class="tag">${esc(p.group)}</span>` : ""}
      <span class="tag ${s}">${n ? `${n} to look at` : "Nothing flagged"}</span></div></button>`;
  }).join("");
  rows.querySelectorAll(".row").forEach((b) => b.onclick = () => show(b.dataset.id));
}

function show(id) {
  const p = DATA.find((x) => x.id === id); if (!p) return; cur = id;
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("on", r.dataset.id === id));
  const cats = {}; for (const f of p.flags) (cats[f.cat] = cats[f.cat] || []).push(f);
  const catHtml = Object.keys(cats).length ? Object.entries(cats).map(([c, fs]) =>
    `<div class="cat"><div><div>${esc(c)}</div><span class="tag ${sev(fs)}">${sev(fs) === "act" ? "Action" : "Watch"}</span></div><b>${fs.length}</b></div>`).join("")
    : '<div class="cat"><div>Nothing flagged on the public record</div><b>0</b></div>';
  const srcs = p.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> (as of ${fmt(s.as_of)})`).join("<br>");
  document.getElementById("detail").innerHTML = `<div class="dbody">
    <h3>${esc(p.applicant)}</h3>
    <p class="sub">${esc([p.substation, p.state, p.region].filter(Boolean).join(" · "))}${p.group ? ` · Group: ${esc(p.group)}` : ""}</p>
    <div class="facts">
      <div class="fact"><span>Type</span><b>${esc(p.type || "—")}</b></div>
      <div class="fact"><span>Installed capacity</span><b>${mw(p.installed)}</b></div>
      <div class="fact"><span>GNA</span><b>${mw(p.gna)}</b></div>
      <div class="fact"><span>Connectivity</span><b>${mw(p.conn)}</b></div>
      <div class="fact"><span>Status</span><b>${esc(p.status || "—")}</b></div>
      <div class="fact"><span>Expected start</span><b>${fmt(p.expected)}</b></div>
    </div>
    <div class="sect"><h4>What needs attention</h4><div class="cats">${catHtml}</div></div>
    <div class="lock">
      <div class="blur">
        <p><b>Connectivity timing</b> — what the date means for this project, with the document behind it.</p>
        <p><b>Charges</b> — amounts due and by when, in rupees.</p>
        <p><b>Guarantees</b> — when they come back, and what could call them.</p>
        <p><b>Rule changes</b> — which drafts and amendments reach this project, and the rupee effect.</p>
      </div>
      <div class="cta"><b>Full project report</b><div class="btns"><button class="btn gold">Get the report</button><button class="btn">Watch this project</button></div></div>
    </div>
    <div class="src">Applications: <span class="mono">${esc(p.apps.join(", "))}</span><br>${srcs}<br>
      <button class="claim">This is our project: send a correction</button></div>
  </div>`;
}

function search() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return render(DATA);
  const terms = q.split(/\s+/);
  render(DATA.filter((p) => { const hay = [p.applicant, p.group, p.substation, p.state, p.region, p.type, ...p.apps].join(" ").toLowerCase(); return terms.every((t) => hay.includes(t)); }));
}

fetch("https://qmmtlyqxtiovkxezldtg.supabase.co/functions/v1/projects-public").then((r) => r.json()).then((d) => {
  DATA = d.projects; META = d.meta;
  const groups = [...new Set(DATA.map((p) => p.group).filter(Boolean))].sort();
  document.getElementById("chips").innerHTML = groups.slice(0, 12).map((g) => `<button class="chip">${esc(g)}</button>`).join("");
  document.querySelectorAll(".chip").forEach((c) => c.onclick = () => { document.getElementById("q").value = c.textContent; search(); });
  const tot = DATA.reduce((a, p) => a + (Number(p.installed) || Number(p.conn) || 0), 0);
  document.getElementById("stats").innerHTML = `<div><b>${DATA.length.toLocaleString("en-IN")}</b>projects</div><div><b>${Math.round(tot / 1000).toLocaleString("en-IN")} GW</b>capacity</div><div><b>${new Set(DATA.map((p) => p.state).filter(Boolean)).size}</b>states</div><div><b>${fmt(META.as_of)}</b>as of</div>`;
  render(DATA);
});
document.getElementById("q").addEventListener("input", search);
</script>
</body>
</html>
